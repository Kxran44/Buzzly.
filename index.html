/* Buzzly - Neumorphism */
:root{--bg:#e0e5ec;--s1:#a3b1c6;--s2:#ffffff;--tx:#4b5563;--ac:#22a05a;--ab:#d6ecdf;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#2a2e35;--s1:#1a1d22;--s2:#3a3f48;--tx:#e5e7eb;--ab:#1d5a38;color-scheme:dark}}
*{box-sizing:border-box;font-family:"DejaVu Sans",system-ui,"Segoe UI",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);overflow:hidden;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
button,input{color:var(--tx);background:var(--bg);border:0;outline:0;font-size:15px}
button{cursor:pointer}
.r{box-shadow:6px 6px 12px var(--s1),-6px -6px 12px var(--s2)}
.rs{box-shadow:4px 4px 8px var(--s1),-4px -4px 8px var(--s2)}
.i{box-shadow:inset 5px 5px 10px var(--s1),inset -5px -5px 10px var(--s2)}
.pn{box-shadow:10px 10px 22px var(--s1),-10px -10px 22px var(--s2)}
button:active:not(.pi){box-shadow:inset 3px 3px 6px var(--s1),inset -3px -3px 6px var(--s2)}
.ib{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;padding:0}
.ib svg,.ico,.pi svg{width:22px;height:22px;fill:none;stroke:var(--ac);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.ac{color:var(--ac);font-weight:700}
.sub{opacity:.65;font-size:13px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{padding:10px 18px;border-radius:20px;text-decoration:none;color:var(--tx);display:inline-block;font-size:14px;background:var(--bg)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:8px 0 16px}
.sw{width:34px;height:34px;border-radius:50%;cursor:pointer}
input[type=color]{width:40px;height:40px;padding:0;border-radius:50%;overflow:hidden;cursor:pointer}
input[type=text],input[type=password]{width:100%;padding:13px 18px;border-radius:24px;margin-bottom:14px}

/* avatar */
.av{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;padding:8px;background:var(--bg);position:relative}
.av span{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:20px;background:rgba(150,165,190,.38)}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av.big{width:104px;height:104px;padding:10px;margin:0 auto}.av.big span{font-size:38px}

/* auth */
#auth{display:flex;height:100%;align-items:center;justify-content:center;padding:18px}
.card{width:100%;max-width:370px;border-radius:28px;padding:26px;background:var(--bg);max-height:90%;overflow:auto}
.card h3{margin:6px 0}
.tabs{display:flex;gap:12px;margin-bottom:20px}.tabs button{flex:1;padding:12px;border-radius:20px;font-weight:600}
#err{color:#ef4444;font-size:13px;min-height:18px;margin-bottom:8px}
#go{width:100%;padding:13px;border-radius:24px;font-weight:700;color:var(--ac)}

/* app (desktop = mockup layout) */
#app{display:none;height:100%;padding:30px;gap:30px}
.side{width:370px;flex:none;border-radius:30px;padding:28px 25px 0;display:flex;flex-direction:column;min-height:0}
.main{flex:1;min-width:0;border-radius:30px;padding:22px 30px 26px;display:flex;flex-direction:column;min-height:0}
.sh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px;padding:0 3px 0 5px}
.logo{font-size:28px;font-weight:700;color:var(--ac);line-height:1.2}
.sh .ib{width:42px;height:42px}
.sr{position:relative;margin-bottom:26px}
.sr input{height:52px;margin:0;padding:0 70px 0 26px;border-radius:26px}
.sr .ib{position:absolute;right:7px;top:3px;width:46px;height:46px}
#cl{flex:1;overflow-y:auto;padding:8px 8px 26px;margin:-8px -8px 0}
.ci{height:100px;border-radius:26px;padding:0 20px 0 17px;display:flex;gap:20px;align-items:center;margin-bottom:18px;cursor:pointer}
.ci .nm{font-size:18px}
.bd{background:var(--ac);color:#fff;border-radius:12px;padding:2px 8px;font-size:12px}

#hd{display:flex;align-items:center;gap:16px;padding:0 0 24px;position:relative}
#hd::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;border-radius:3px;box-shadow:inset 2px 2px 3px var(--s1),inset -2px -2px 3px var(--s2)}
#hav .av{width:48px;height:48px;padding:7px}#hav .av span{font-size:16px}
.hi{flex:1;min-width:0}.hi b{font-size:24px}
.hb{width:62px;height:62px}.hb svg{width:28px;height:28px}
.mo,.bk{display:none}
#hs.o{color:var(--ac);opacity:1}#hs.o::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ac);margin-right:7px}

#ms{flex:1;overflow-y:auto;padding:34px 10px 22px;display:flex;flex-direction:column;gap:24px}
.mw{display:flex;flex-direction:column;align-items:flex-start;max-width:70%}
.mw.me{align-self:flex-end;align-items:flex-end}
.m{position:relative;padding:16px 24px;border-radius:24px;font-size:16px;line-height:1.4;word-break:break-word;cursor:pointer;background:var(--bg);box-shadow:5px 5px 10px var(--s1),-5px -5px 10px var(--s2);animation:pop .2s ease}
.m.me{background:var(--ab);color:color-mix(in srgb,var(--ac) 65%,#000)}
.m img{max-width:100%;border-radius:14px;display:block}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.mt{font-size:11px;opacity:.6;margin:16px 12px 0}
.rc{position:absolute;right:12px;bottom:-14px;padding:1px 9px;border-radius:14px;font-size:13px;background:var(--bg)}
.rbar{position:absolute;top:-50px;left:0;display:flex;gap:12px;padding:8px 14px;border-radius:24px;background:var(--bg);z-index:5;font-size:20px;color:var(--tx)}
.empty{margin:auto;text-align:center;opacity:.6}

.cmp{display:none;align-items:center;gap:20px;padding-top:12px}
.pb{flex:1;height:64px;border-radius:32px;display:flex;align-items:center;padding:0 14px 0 28px;gap:2px;min-width:0}
.pb input{flex:1;min-width:0;height:100%;margin:0;padding:0;border-radius:0;background:transparent;box-shadow:none}
.pi{width:40px;height:40px;border-radius:50%;background:transparent;box-shadow:none;display:grid;place-items:center;padding:0;flex:none}
#mic.rec{color:#ef4444;font-size:13px;width:auto;padding:0 8px}#mic.rec svg{stroke:#ef4444}
.ib.send{width:80px;height:80px}
#ep{display:none;flex-wrap:wrap;gap:8px;padding:14px;border-radius:22px;margin-top:10px;font-size:22px;cursor:pointer}

/* menu / modal / toast */
#mn{position:fixed;display:none;background:var(--bg);border-radius:22px;padding:8px;min-width:210px;z-index:30}
#mn div{padding:12px 18px;cursor:pointer;border-radius:14px}
#mn .mp{display:flex;gap:12px;align-items:center;padding:8px 12px 12px}
#mn .mp .av{width:46px;height:46px;padding:6px}
#md{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(24,32,48,.55);backdrop-filter:blur(5px);padding:max(18px,env(safe-area-inset-top,0px)) 18px max(18px,env(safe-area-inset-bottom,0px));z-index:40}
#ts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--bg);padding:12px 20px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;max-width:90%;font-size:14px}

/* mobile = normal app screens */
@media (max-width:760px){
 #app{padding:12px;gap:0}
 .side{width:100%;padding:20px 16px 0;border-radius:26px}
 .main{display:none;width:100%;padding:16px;border-radius:26px}
 #app.o .side{display:none}#app.o .main{display:flex}
 .bk,.mo{display:grid}
 .hb,#hd .ib{width:40px;height:40px}.hb svg,#hd .ib svg{width:20px;height:20px}
 #hd{gap:8px;padding-bottom:16px}.hi b{font-size:17px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#hav .av{width:40px;height:40px;padding:5px}
 .ci{height:84px;margin-bottom:14px}
 .mw{max-width:86%}#ms{padding:22px 4px 14px;gap:20px}
 .cmp{gap:10px}.pb{height:52px;padding:0 4px 0 16px}.pi{width:34px;height:34px}.ib.send{width:52px;height:52px}.ib.send svg{width:24px!important;height:24px!important}
}
.ci b{font-size:18px}.ci .sub{font-size:13px;margin-top:6px}

/* settings modal: soft, readable */
#md .card{box-shadow:0 24px 60px rgba(0,0,0,.3);max-width:380px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0 18px}
.chip{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:18px;font-size:14px;text-align:left}
.chip i{width:16px;height:16px;border-radius:50%;display:block;flex:none;border:1px solid rgba(0,0,0,.15)}
.chip span{margin-left:2px;color:var(--tx)}
.card h3{font-size:15px;margin:14px 0 6px;color:var(--tx)}

<div class="av big rs" style="margin-bottom:16px"><svg class="ico" style="width:44px;height:44px" viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-5 4V6a1 1 0 0 1 1-1z"/></svg></div>
<h2 class="ac" style="text-align:center;margin:0 0 4px">Buzzly</h2>
<div class="sub" style="text-align:center;margin-bottom:18px">Baat karo, bina rukawat</div>
<div id="demo" class="sub" style="display:none;text-align:center;margin:-8px 0 16px;color:#d97706;opacity:1">Demo mode: users sirf isi browser mein hain</div>

<input id="pw" type="password" placeholder="Password" class="i">

<div id="err"></div>
<button id="go" class="rs" onclick="go()">Sign In</button>
</div></div>

<div id="app">
 <aside class="side pn">
  <div class="sh"><div><div class="logo">Buzzly</div><div class="sub" id="mnm"></div></div>
   <button class="ib rs" onclick="menu(event)" title="Menu"><svg viewBox="0 0 24 24" style="fill:var(--tx);stroke:none;opacity:.55"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button></div>
  <div class="sr"><input id="sq" type="text" placeholder="Username search..." class="i" onkeydown="if(event.key==='Enter')add()"><button class="ib rs" onclick="add()" title="Add"><svg viewBox="0 0 24 24" style="width:26px;height:26px;stroke-width:2.4"><path d="M12 5v14M5 12h14"/></svg></button></div>
  <div id="cl"></div>

   <button class="ib rs mo" onclick="menu(event)"><svg viewBox="0 0 24 24" style="fill:var(--tx);stroke:none;opacity:.55"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button></div>
  <div id="ms"><div class="empty">Kisi chat ko chunein<br>ya username search karke naya chat shuru karein</div></div>

let fb=null,auth=null,off=0,me=null,peer=null,rec=null,tmr=null,rxOpen=null,vs=null,mode='in';
const known=new Set(),initd=new Set(),wt=new Set(),C={users:{},sets:{},msgs:{}};
const now=()=>Date.now()+off,ck=(a,b)=>[a,b].sort().join('~'),TS=()=>firebase.database.ServerValue.TIMESTAMP;
const U=()=>C.users;

const S=u=>{const s=Object.assign({th:'soft',tm:'auto'},C.sets[u]||{});['ct','mu','bl'].forEach(k=>s[k]=arr(s[k]));return s};
function save(){if(!fb)L.s('bz_C',C)}
function loadLocal(){const c=L.g('bz_C',null);if(c){C.users=c.users||{};C.sets=c.sets||{};C.msgs=c.msgs||{}}}
function migrate(){if(L.g('bz_C',null))return;const u=L.g('bz_u',null);if(!u)return;C.users=u;L.g('bz_m',[]).forEach(m=>{const k=ck(m.f,m.t);(C.msgs[k]=C.msgs[k]||{})[m.id]=m});Object.keys(u).forEach(x=>{const s=L.g('bz_s_'+x,null);if(s)C.sets[x]=s});save()}
function wSet(u,s){C.sets[u]=s;fb?fb.ref('settings/'+u).set(s):save()}
function wUser(u,p){Object.assign(C.users[u]=C.users[u]||{},p);fb?fb.ref('users/'+u).update(p):save()}
function wMsg(m){const k=ck(m.f,m.t);(C.msgs[k]=C.msgs[k]||{})[m.id]=m;if(fb){fb.ref('chats/'+k+'/'+m.id).set(m);fb.ref('userChats/'+m.f+'/'+m.t).set(true);fb.ref('userChats/'+m.t+'/'+m.f).set(true)}else save()}

function wRx(m){const k=ck(m.f,m.t);fb?fb.ref('chats/'+k+'/'+m.id+'/r/'+me).set((m.r||{})[me]||null):save()}

const tm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
function ago(t){const s=(now()-t)/1000;return s<45?'just now':s<3600?Math.round(s/60)+' min ago':s<86400?Math.floor(s/3600)+' hr ago':Math.floor(s/86400)+' d ago'}

const lum=h=>{const n=parseInt(h.slice(1),16);return((n>>16)*.3+(n>>8&255)*.59+(n&255)*.11)/255};
function mix(h,t,p){const n=parseInt(h.slice(1),16),f=c=>Math.round(c+((t?255:0)-c)*p);return'#'+[n>>16,n>>8&255,n&255].map(c=>f(c).toString(16).padStart(2,'0')).join('')}

 const s=S(me);let t=OLD[s.th]||s.th;if(t!=='custom'&&!P[t])t='soft';
 const bg=t==='custom'?(s.bg||'#e0e5ec'):P[t][1],ac=s.ac||(t==='custom'?'#22a05a':P[t][2]),l=lum(bg),d=l<.5;
 let tx=d?'#e5e7eb':'#4b5563';const w=s.tm==='dark'?'#1f2937':s.tm==='light'?'#f3f4f6':null;if(w&&Math.abs(lum(w)-l)>.4)tx=w;
 r.setProperty('--bg',bg);r.setProperty('--s1',t==='soft'?'#a3b1c6':mix(bg,0,d?.5:.2));r.setProperty('--s2',t==='soft'?'#ffffff':mix(bg,1,d?.1:.6));
 r.setProperty('--tx',tx);r.setProperty('--ac',ac);r.setProperty('--ab',d?mix(ac,0,.6):mix(ac,1,.8));r.colorScheme=d?'dark':'light'}

/* ---------- auth ---------- */
async function hs(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return s}}
const fbErr=x=>({'auth/email-already-in-use':'Ye username pehle se liya hua hai','auth/invalid-credential':'Galat username ya password','auth/wrong-password':'Galat username ya password','auth/user-not-found':'Galat username ya password','auth/weak-password':'Password kam se kam 6 character ka ho','auth/operation-not-allowed':'Firebase console mein Email/Password sign-in ON karo','auth/network-request-failed':'Internet check karo','auth/too-many-requests':'Bahut try ho gaye, thodi der baad karo'}[x&&x.code]||('Error: '+((x&&x.message)||x)));
function tab(m){mode=m;$('#pw2').style.display=m==='up'?'block':'none';$('#go').textContent=m==='up'?'Sign Up':'Sign In';$('#t_in').className=m==='in'?'i':'rs';$('#t_up').className=m==='up'?'i':'rs';$('#err').textContent=''}
async function go(){const u=$('#un').value.trim().toLowerCase(),p=$('#pw').value,e=$('#err'),su=mode==='up';e.textContent='';
 if(!/^[a-z0-9_]{3,20}$/.test(u)){e.textContent='Username 3-20 letters/numbers/_ ka ho';return}
 const mn=fb?6:4;if(p.length<mn){e.textContent='Password kam se kam '+mn+' character ka ho';return}
 if(su&&p!==$('#pw2').value){e.textContent='Password aur Confirm Password match nahi karte';return}
 $('#go').disabled=true;
 try{
  if(fb){const em=u+'@buzzly.app';
   if(su){await auth.createUserWithEmailAndPassword(em,p);await fb.ref('users/'+u).set({ph:u===OWNER_USERNAME?ANIME:'',ls:TS()})}
   else await auth.signInWithEmailAndPassword(em,p)
  }else if(su){
   if(C.users[u]){e.textContent='Ye username pehle se liya hua hai';return}
   C.users[u]={p:await hs(p),ph:(u===OWNER_USERNAME||!Object.keys(C.users).length)?ANIME:'',ls:now()};save();login(u)
  }else{
   if(!C.users[u]||C.users[u].p!==await hs(p)){e.textContent='Galat username ya password';return}
   login(u)}
 }catch(x){e.textContent=fbErr(x)}finally{$('#go').disabled=false}}
function login(u){if(me===u&&$('#app').style.display==='flex')return;me=u;$('#auth').style.display='none';$('#app').style.display='flex';$('#mnm').textContent='@'+me;theme();
 if(fb)fbStart();else{L.s('bz_me',u);M().forEach(m=>known.add(m.id));if(!stOK)toast('Browser storage blocked hai, data save nahi hoga')}
 beat();renderList()}
function out(){if(fb){auth.signOut().then(()=>location.reload())}else{L.s('bz_me',null);location.reload()}}

/* ---------- firebase listeners ---------- */
function fbStart(){
 fb.ref('.info/serverTimeOffset').on('value',s=>{off=s.val()||0});
 fb.ref('users/'+me+'/ls').onDisconnect().set(TS());
 fb.ref('users/'+me).on('value',s=>{if(!s.exists()){fb.ref('users/'+me).set({ph:'',ls:TS()});return}C.users[me]=s.val();renderList()});
 fb.ref('settings/'+me).on('value',s=>{C.sets[me]=s.val()||{};theme();arr(C.sets[me].ct).forEach(watch);renderList();renderHead()});
 fb.ref('userChats/'+me).on('value',s=>{Object.keys(s.val()||{}).forEach(watch);renderList()})}
function watch(u){if(wt.has(u)||u===me)return;wt.add(u);
 fb.ref('users/'+u).on('value',s=>{C.users[u]=s.val()||{};renderHead();renderList()});
 const k=ck(me,u);
 fb.ref('chats/'+k).on('value',s=>{C.msgs[k]=s.val()||{};incoming(k,!initd.has(k));initd.add(k);renderChat();renderList()})}
function incoming(k,first){const s=S(me);Object.values(C.msgs[k]||{}).forEach(m=>{if(known.has(m.id))return;known.add(m.id);
 if(!first&&m.t===me&&!s.mu.includes(m.f)&&!s.bl.includes(m.f)&&(m.f!==peer||document.hidden))toast(m.f+': '+(m.k==='img'?'📷 Photo':m.k==='aud'?'🎤 Voice':String(m.v).slice(0,40)))})}
function beat(){if(!me)return;if(fb)fb.ref('users/'+me+'/ls').set(TS());else if(C.users[me]){C.users[me].ls=now();save()}}

/* ---------- chat list ---------- */
function convos(){const set=new Set(S(me).ct);Object.keys(C.msgs).forEach(k=>{const p=k.split('~');if(p.includes(me))p.forEach(x=>{if(x!==me)set.add(x)})});return[...set].filter(x=>x!==me&&(fb||C.users[x]))}
const prev=m=>m.k==='img'?'📷 Photo':m.k==='aud'?'🎤 Voice message':esc(m.v);
function renderList(){if(!me)return;const s=S(me);
 const rows=convos().map(u=>{const c=Object.values(C.msgs[ck(me,u)]||{}).sort((a,b)=>a.ts-b.ts),l=c[c.length-1];return{u,l,n:c.filter(m=>m.t===me&&!m.seen).length,t:l?l.ts:0}}).sort((a,b)=>b.t-a.t);
 $('#cl').innerHTML=rows.map(r=>`<div class="ci ${r.u===peer?'i':'rs'}" data-u="${esc(r.u)}" onclick="openChat(this.dataset.u)">${av(r.u)}<div style="flex:1;min-width:0"><b>${esc(r.u)}</b>${s.mu.includes(r.u)?' 🔕':''}<div class="sub ell">${r.l?prev(r.l):'Naya chat'}</div></div>${r.n?`<span class="bd">${r.n}</span>`:''}</div>`).join('')||'<p class="sub" style="text-align:center">Username search karke chat shuru karein</p>'}
async function add(){const u=$('#sq').value.trim().toLowerCase();if(!u)return;
 if(u===me){toast('Ye aapka apna username hai');return}
 if(fb){const s=await fb.ref('users/'+u).once('value');if(!s.exists()){toast('Ye username exist nahi karta');return}C.users[u]=s.val()}
 else if(!C.users[u]){toast('Ye username is browser mein nahi mila. Demo mode mein sirf isi browser ke users milte hain, alag device ke liye Firebase jodo.');return}
 const s=S(me);if(!s.ct.includes(u)){s.ct.push(u);wSet(me,s)}if(fb)watch(u);$('#sq').value='';openChat(u)}
function openChat(u){peer=u;rxOpen=null;$('#app').classList.add('o');$('#hd').style.display='flex';$('#cmp').style.display='flex';renderHead();renderChat(1);renderList()}
function back(){peer=null;$('#app').classList.remove('o');renderList()}
function renderHead(){if(!peer)return;$('#hav').innerHTML=av(peer);$('#hn').textContent=peer;
 const b=S(me).bl.includes(peer),ls=(U()[peer]||{}).ls;$('#hs').textContent=b?'Blocked':onl(peer)?'online':ls?'last seen '+ago(ls):'';$('#hs').className=!b&&onl(peer)?'sub o':'sub'}

/* ---------- messages ---------- */
function mark(){if(!peer||document.hidden)return;const k=ck(me,peer),ids=Object.values(C.msgs[k]||{}).filter(m=>m.f===peer&&!m.seen).map(m=>m.id);if(ids.length)wSeen(k,ids)}
function renderChat(f){if(!peer)return;mark();const el=$('#ms'),nb=el.scrollHeight-el.scrollTop-el.clientHeight<90;
 const c=Object.values(C.msgs[ck(me,peer)]||{}).sort((a,b)=>a.ts-b.ts);
 el.innerHTML=c.map(m=>{const x=m.f===me,v=esc(m.v),b=m.k==='img'&&/^data:image\//.test(m.v)?`<img src="${v}">`:m.k==='aud'&&/^data:audio\//.test(m.v)?`<audio controls src="${v}" style="max-width:100%" onclick="event.stopPropagation()"></audio>`:v,rx=Object.values(m.r||{}).map(esc).join(' ');
  return`<div class="mw ${x?'me':''}"><div class="m ${x?'me':''}" onclick="rb('${esc(m.id)}')">${b}${rx?`<span class="rc rs">${rx}</span>`:''}${rxOpen===m.id?`<div class="rbar r">${RX.map(e=>`<span onclick="event.stopPropagation();react('${esc(m.id)}','${e}')">${e}</span>`).join('')}${x?`<span title="Delete" onclick="event.stopPropagation();del('${esc(m.id)}')">🗑</span>`:''}</div>`:''}</div><div class="mt">${tm(m.ts)}${x?` · Sent ${ago(m.ts)}${m.seen?` · Seen ${ago(m.seen)}`:''}`:''}</div></div>`}).join('')||'<div class="empty">Abhi koi message nahi. Hello bolo! 👋</div>';
 if(f||nb)el.scrollTop=el.scrollHeight}
async function send(k,v){if(!peer)return;
 if(S(me).bl.includes(peer)){toast('Pehle '+peer+' ko unblock karein');return}
 const pb=fb?arr((await fb.ref('settings/'+peer+'/bl').once('value')).val()):S(peer).bl;
 if(pb.includes(me)){toast('Is user ne aapko block kiya hai');return}
 const m={id:Math.round(now()).toString(36)+Math.random().toString(36).slice(2,6),f:me,t:peer,k,v,ts:now(),seen:0};wMsg(m);known.add(m.id);renderChat(1);renderList()}
function sendT(){const i=$('#mi'),v=i.value.trim();if(!v)return;send('text',v);i.value=''}
const findM=id=>M().find(x=>x.id===id);
function rb(id){rxOpen=rxOpen===id?null:id;renderChat()}
function react(id,e){const m=findM(id);if(!m)return;m.r=m.r||{};if(m.r[me]===e)delete m.r[me];else m.r[me]=e;rxOpen=null;wRx(m);renderChat()}
function del(id){const m=findM(id);if(m)wDel(m);rxOpen=null;renderChat();renderList()}
function ep(){const p=$('#ep');if(!p.innerHTML)p.innerHTML=E.map(e=>`<span onclick="$('#mi').value+='${e}';$('#mi').focus()">${e}</span>`).join('');p.style.display=p.style.display==='flex'?'none':'flex'}

/* ---------- media ---------- */
function shrink(f,max,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};i.src=r.result};r.readAsDataURL(f)}
$('#fi').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)shrink(f,900,d=>send('img',d))};
$('#fp').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)shrink(f,200,d=>{wUser(me,{ph:d});renderList();renderHead()})};
$('#fa').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)shrink(f,300,d=>{L.s('bz_ap',d);about()})};
async function mic(){const b=$('#mic');
 if(rec&&rec.state==='recording'){rec.stop();return}
 if(!peer){toast('Pehle chat kholein');return}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[];rec=new MediaRecorder(st);
  rec.ondataavailable=e=>ch.push(e.data);
  rec.onstop=()=>{st.getTracks().forEach(t=>t.stop());clearInterval(tmr);b.classList.remove('rec');b.innerHTML=MIC;const fr=new FileReader();fr.onload=()=>send('aud',fr.result);fr.readAsDataURL(new Blob(ch,{type:rec.mimeType}))};
  rec.start();b.classList.add('rec');let s=0;b.textContent='0s';tmr=setInterval(()=>{s++;b.textContent=s+'s';if(s>=60)rec.stop()},1000)
 }catch(e){toast('Mic permission chahiye')}}
async function vc(k){if(!peer)return;const v=k==='v';
 modal(`<h3>${v?'Video':'Voice'} call · ${esc(peer)}</h3>${v?'<video id="lv" autoplay muted playsinline style="width:100%;border-radius:20px;margin:8px 0"></video>':`<div style="text-align:center;margin:14px 0">${av(peer).replace('class="av','class="av big')}<p class="ac">Calling ${esc(peer)}...</p></div>`}<p class="sub">${v?'Camera preview. ':''}Do devices ke beech asli call (WebRTC) agle step mein judegi.</p>`);
 try{vs=await navigator.mediaDevices.getUserMedia({video:v,audio:true});if(v)$('#lv').srcObject=vs}catch(e){toast((v?'Camera aur mic':'Mic')+' permission chahiye')}}

/* ---------- menu, settings, about ---------- */
document.addEventListener('click',()=>{$('#mn').style.display='none'});
function menu(e){e.stopPropagation();const s=S(me),r=e.currentTarget.getBoundingClientRect(),m=$('#mn');
 m.innerHTML=`<div class="mp" onclick="$('#fp').click()">${av(me)}<div><b>@${esc(me)}</b><div class="sub">Profile photo badlein</div></div></div><div onclick="setm()">Theme &amp; colours</div><div onclick="about()">About me</div>`+(peer?`<div onclick="tog('mu')">${s.mu.includes(peer)?'Unmute':'Mute'} notifications</div><div onclick="tog('bl')">${s.bl.includes(peer)?'Unblock':'Block'} ${esc(peer)}</div>`:'')+`<div onclick="out()">Logout</div>`;
 m.style.display='block';m.style.top=Math.min(r.bottom+8,innerHeight-m.offsetHeight-10)+'px';m.style.left=Math.max(10,Math.min(r.left-170,innerWidth-m.offsetWidth-10))+'px'}
function tog(k){const s=S(me),i=s[k].indexOf(peer);i<0?s[k].push(peer):s[k].splice(i,1);wSet(me,s);
 toast(k==='mu'?(i<0?'Notifications mute':'Notifications unmute'):(i<0?peer+' blocked':peer+' unblocked'));renderHead();renderList()}
function modal(h){const m=$('#md');m.innerHTML=`<div class="card" onclick="event.stopPropagation()">${h}<button class="pill rs" style="margin-top:10px" onclick="cm()">Close</button></div>`;m.style.display='flex';m.onclick=cm}
function cm(){$('#md').style.display='none';$('#md').innerHTML='';if(vs){vs.getTracks().forEach(t=>t.stop());vs=null}}
function setm(){const s=S(me),cur=OLD[s.th]||s.th,b=(l,k,v)=>`<button class="pill ${s[k]===v?'i':'rs'}" onclick="up('${k}','${v}')">${l}</button>`,
 chip=(k,n,bg,ac)=>`<button class="chip ${cur===k?'i':'rs'}" onclick="up('th','${k}')"><i style="background:${bg}"></i><i style="background:${ac}"></i><span>${n}</span></button>`;
 modal(`<h3>Theme</h3><div class="chips">${Object.entries(P).map(([k,v])=>chip(k,v[0],v[1],v[2])).join('')}${chip('custom','Custom','conic-gradient(#f87171,#fbbf24,#34d399,#60a5fa,#a78bfa,#f87171)','#888')}</div>
 ${cur==='custom'?`<h3>Background colour</h3><div class="row"><input type="color" value="${s.bg||'#e0e5ec'}" oninput="up('bg',this.value,1)"></div>`:''}
 <h3>Accent colour</h3><div class="row">${['#22a05a','#3b82f6','#ec4899','#f59e0b','#8b5cf6','#ef4444'].map(c=>`<span class="sw rs" style="background:${c}" onclick="up('ac','${c}')"></span>`).join('')}<input type="color" value="${s.ac||'#22a05a'}" oninput="up('ac',this.value,1)"></div>
 <h3>Text</h3><div class="row">${b('Auto','tm','auto')}${b('Dark text','tm','dark')}${b('Light text','tm','light')}</div>
 <button class="pill rs" onclick="rst()">Reset theme</button>`)}
function up(k,v,q){const s=S(me);s[k]=v;if(k==='th')delete s.ac;wSet(me,s);theme();if(!q)setm()}
function rst(){const s=S(me);s.th='soft';s.tm='auto';delete s.ac;delete s.bg;wSet(me,s);theme();setm()}
function about(){const p=L.g('bz_ap',ANIME);
 modal(`<div style="text-align:center"><div class="av rs big"><img src="${esc(p)}" alt=""></div><h2 class="ac" style="margin:14px 0 4px">Kxran</h2><div class="sub">Developer of Buzzly</div>
 <div class="row" style="justify-content:center;margin:16px 0"><a class="pill rs" href="${LK}" target="_blank" rel="noopener">LinkedIn</a><a class="pill rs" href="${GH}" target="_blank" rel="noopener">GitHub</a></div>
 <button class="pill rs" onclick="$('#fa').click()">Upload photo</button></div>`)}

/* ---------- live updates + start ---------- */
addEventListener('pagehide',beat);
addEventListener('visibilitychange',()=>{if(!document.hidden&&peer)renderChat()});
addEventListener('storage',e=>{if(e.key==='bz_me'&&!fb){location.reload();return}if(fb||!me||e.key!=='bz_C')return;
 loadLocal();Object.keys(C.msgs).forEach(k=>incoming(k,false));theme();renderHead();renderChat();renderList()});
setInterval(()=>{if(!me)return;beat();renderHead();renderList();
 if(!(rec&&rec.state==='recording')&&![...document.querySelectorAll('audio')].some(a=>!a.paused))renderChat()},15000);

tab('in');
if(FIREBASE_CONFIG&&window.firebase){try{firebase.initializeApp(FIREBASE_CONFIG);fb=firebase.database();auth=firebase.auth();
 auth.onAuthStateChanged(u=>{if(u)login(u.email.split('@')[0]);else if(me)location.reload()})}catch(e){fb=null;console.error(e)}}
if(!fb){$('#demo').style.display='block';loadLocal();migrate();me=L.g('bz_me',null);if(me&&C.users[me])login(me);else me=null}

</script>
